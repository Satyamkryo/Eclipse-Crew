pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;

        if ($request_method = CONNECT) { return 405; }
        if ($request ~* "^[A-Z]+[[:space:]]+https?://") { return 400; }

        # Uploads: a coarse outer limit only (the app enforces MAX_UPLOAD_MB while streaming), and no request
        # buffering so a large body is streamed to the app instead of being held in nginx.
        location ~ "^/api/agents/[^/]+/files$" {
            client_max_body_size 1g;
            client_body_timeout 120s;
            proxy_request_buffering off;
            set $app_upstream app:3000;
            proxy_pass http://$app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
        }

        location / {
            set $app_upstream app:3000;
            proxy_pass http://$app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }
    }
}
