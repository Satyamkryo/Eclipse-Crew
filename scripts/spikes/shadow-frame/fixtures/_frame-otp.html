<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One-time code frame</title>
<script>window.__spikeClicks = []; window.__spikeClick = (name) => { window.__spikeClicks = [...(window.__spikeClicks || []), name]; };</script>
<style>body { margin: 8px; font: 14px sans-serif; } input { width: 180px; height: 26px; display: block; margin: 0 0 8px; }</style>
</head>
<body>
<input type="text" autocomplete="one-time-code" aria-label="Verification code" maxlength="6" inputmode="numeric">
<button onclick="__spikeClick('Frame ready')">Frame ready</button>
</body>
</html>
