<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cross-site</title>
<script>window.__spikeClicks = []; window.__spikeClick = (name) => { window.__spikeClicks = [...(window.__spikeClicks || []), name]; };</script>
<style>body { margin: 0; font: 14px sans-serif; } iframe { position: absolute; border: 0; }</style>
</head>
<body>
<button style="position:absolute;left:20px;top:300px;width:200px;height:36px" onclick="__spikeClick('Host page button')">Host page button</button>
<!-- Site B is a different origin and site, so this frame should run out of process. -->
<iframe src="http://localhost:8082/_frame-cross.html" style="left:10px;top:10px;width:300px;height:160px"></iframe>
</body>
</html>
