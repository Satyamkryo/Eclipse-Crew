<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baseline</title>
<script>window.__spikeClicks = []; window.__spikeClick = (name) => { window.__spikeClicks = [...(window.__spikeClicks || []), name]; };</script>
<style>body { margin: 0; font: 14px sans-serif; } button { display: block; position: absolute; width: 220px; height: 36px; }</style>
</head>
<body>
<button style="left:20px;top:20px" onclick="__spikeClick('Plain one')">Plain one</button>
<button style="left:20px;top:70px" onclick="__spikeClick('Plain two')">Plain two</button>
<button style="left:20px;top:120px" onclick="__spikeClick('Plain three')">Plain three</button>
</body>
</html>
